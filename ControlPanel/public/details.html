<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inspect a Silicon Lanes service and its instances.">
    <title>Service details · Silicon Lanes</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark">SL</span>
          <span>Silicon Lanes</span>
        </a>
        <div class="system-status"><span class="status-dot"></span><span>Instance detail</span></div>
      </div>
    </header>

    <main class="shell">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/">Service map</a><span>/</span><span id="breadcrumb-service">Service</span>
      </nav>

      <section class="detail-hero">
        <div>
          <div class="eyebrow" id="service-port">Loading service</div>
          <h1 id="service-name">Service</h1>
          <p id="service-description"></p>
        </div>
        <div class="detail-actions">
          <div class="count-control" aria-label="Number of instances">
            <button type="button" id="decrease-count" aria-label="Decrease instances">−</button>
            <input id="instance-count" type="number" min="1" max="10" value="1" aria-label="Instances to start">
            <button type="button" id="increase-count" aria-label="Increase instances">+</button>
          </div>
          <button class="button primary" id="start-button" type="button">Start more</button>
          <button class="button ghost" id="refresh-button" type="button">Refresh</button>
        </div>
      </section>

      <section aria-labelledby="instances-heading">
        <div class="section-heading">
          <div>
            <h2 id="instances-heading">Running instances</h2>
            <p id="instance-summary">Checking Docker…</p>
          </div>
        </div>
        <div class="notice" id="error-notice" hidden></div>
        <div class="instances-grid" id="instances-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="page-footer"><div class="shell">Each response identifies the container that handled the request.</div></footer>
    <div id="toast-region" aria-live="polite"></div>
    <script type="module" src="/details.js"></script>
  </body>
</html>
